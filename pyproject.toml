[project]
name = "ai-in-water-management"
version = "0.1.0"
description = "AI in Water Management"
readme = "README.md"
requires-python = "==3.12.11"
license = "MIT"
authors = [
  { name = "AI in Water" }
]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "scikit-learn==1.9.0",
  "statsmodels==0.14.6",
  "plotly==6.7.0",
  "jupyterlab==4.5.7",
  "nbformat==5.10.4",
  "ipykernel==7.2.0",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "prettytable==3.17.0",
]

[project.optional-dependencies]
ml = [
  "xgboost==3.2.0",
  "lightgbm==4.6.0",
  "catboost==1.2.10",
  "tensorflow==2.21.0",
  "keras==3.14.1",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "torchaudio==2.11.0",
  "pytorch-lightning==2.6.5",
  "pyod==3.6.0",
]
physics = [
  "deepxde==1.15.0",
  "torchdiffeq==0.2.5",
  "neuraloperator==2.0.0",
  "sympy==1.14.0",
]
gnn = [
  "torch-geometric==2.7.0",
  "networkx==3.6.1",
  "pygsp==0.5.1",
]
water = [
  "xarray==2026.4.0",
  "netCDF4==1.7.4",
  "geopandas==1.1.3",
  "folium==0.20.0",
  "pyarrow==24.0.0",
  "openpyxl==3.1.5",
]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.15",
  "mypy==2.1.0",
  "pre-commit==4.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
